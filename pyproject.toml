[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmfactory"
version = "0.1.0"
description = "BM Factory: benchmarking automation stations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
station = ["pywinauto>=0.6.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/bmfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "system3: needs the live Capitaline desktop",
]
