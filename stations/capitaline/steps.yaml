# Capitaline TP Screener: one search layer, in SOP order (SKILL §3D; Cap-SOP §7.3 G2, §7.4 G3; ruling R8).
# WHAT to do; WHERE is in screen-map.yaml.
# Placeholders in {braces} are filled by the orchestrator from strategy.json and the run.
# Quote every params value: an unquoted off/on/yes/no is read by YAML as a boolean and rejected.
#
# Save-path placeholders must give names the manifest accepts as raw dumps,
# <run_id>_L<n>_<field>_<seq3>.<csv|xls|xlsx> (tests/contracts/test_manifest.py checks the two templates):
#   {run_id}  a RunID, e.g. CAP-FY2526-LIB-20261114-01
#   {layer}   a single digit 1-8 (the template supplies the "L")
#   {field}   matches [A-Za-z0-9]+ (no spaces, hyphens or underscores), e.g. NICCode
#   {seq}     three digits, e.g. 001
#
# Engine behaviour, not listed steps:
#   - "screenshot before every click" (SKILL §3D desktop hygiene)
#   - one evidence-log row per action
#
# Open points for the supervised learning run (H5/H5b):
#   - Does the desktop app have a Parse button? It is in Cap-SOP §7.3, not in SKILL §3D.
#   - How does the screener CSV save work? Steps save_screener_csv..confirm_csv_save are an assumed flow.
#   - For each layer, is {domain} "all companies" (Cap-SOP §7.3) or the ticked industries (SKILL §3D.1)?
#   - The Criteria column of the lower Filters grid versus the Criteria Values list.
#   - Nested Tables tree paths (e.g. Finance -> Financial Overview -> Software).
database: CAP
version: 1
steps:
  # G2: Domain (SKILL §3D.1)
  - {id: open_tp_screener, gate: G2, action: click, target: tp_screener_button, sop_ref: "SKILL §3D.1"}
  - {id: open_domain_tab, gate: G2, action: click, target: domain_tab, sop_ref: "SKILL §3D.1"}
  - {id: set_portfolio_non_aggregate, gate: G2, action: select, target: portfolio_dropdown, params: {value: "Non Aggregate"}, sop_ref: "SKILL §3D.1"}
  - {id: ensure_listed_only_off, gate: G2, action: select, target: listed_only_checkbox, params: {value: "off"}, sop_ref: "SKILL §3D.1"}
  - {id: ensure_bse_off, gate: G2, action: select, target: bse_checkbox, params: {value: "off"}, sop_ref: "SKILL §3D.1"}
  - {id: ensure_nse_off, gate: G2, action: select, target: nse_checkbox, params: {value: "off"}, sop_ref: "SKILL §3D.1"}
  - {id: pick_company_domain, gate: G2, action: select, target: company_domain_tree, params: {value: "{domain}"}, sop_ref: "SKILL §3D.1; Cap-SOP §7.3"}
  - {id: verify_selected_domain, gate: G2, action: wait_for, target: selected_company_domain_list, sop_ref: "SKILL §3D.1; Cap-SOP §7.3"}
  - {id: screenshot_domain, gate: G2, action: screenshot, target: null, params: {name: "domain"}, sop_ref: "Cap-SOP §8 evidence rule"}
  # G2: Filters, Parse, Show SQL, Run Query (SKILL §3D.2; Cap-SOP §7.3)
  - {id: open_filters_tab, gate: G2, action: click, target: filters_tab, sop_ref: "SKILL §3D.2"}
  - {id: pick_table, gate: G2, action: select, target: tables_tree, params: {value: "{table}"}, sop_ref: "SKILL §3D.2"}
  - {id: pick_field, gate: G2, action: select, target: fields_checklist, params: {value: "{field}"}, sop_ref: "SKILL §3D.2"}
  - {id: show_criteria_values, gate: G2, action: click, target: display_criteria_values_button, sop_ref: "SKILL §3D.2"}
  - {id: set_criteria, gate: G2, action: select, target: criteria_values_list, params: {value: "{criteria}"}, sop_ref: "SKILL §3D.2"}
  - {id: set_year_range, gate: G2, action: type, target: year_range_cell, params: {value: "{year_range}"}, sop_ref: "SKILL §3D.2"}
  - {id: parse_query, gate: G2, action: click, target: parse_button, sop_ref: "Cap-SOP §7.3"}
  - {id: show_sql, gate: G2, action: click, target: show_sql_button, sop_ref: "SKILL §3D.2; Cap-SOP §7.3"}
  - {id: capture_sql, gate: G2, action: read_text, target: sql_text_box, sop_ref: "SKILL §3D.3; Cap-SOP §7.3"}
  - {id: screenshot_sql, gate: G2, action: screenshot, target: null, params: {name: "sql"}, sop_ref: "Cap-SOP §8 evidence rule"}
  - {id: run_query, gate: G2, action: click, target: run_query_button, sop_ref: "Cap-SOP §7.3"}
  # G2: Output row count (SKILL §3D.3)
  - {id: open_output_tab, gate: G2, action: click, target: output_tab, sop_ref: "SKILL §3D.3"}
  - {id: read_output, gate: G2, action: read_grid, target: output_grid, sop_ref: "SKILL §3D.3; Cap-SOP §8 evidence rule"}
  - {id: screenshot_output, gate: G2, action: screenshot, target: null, params: {name: "output"}, sop_ref: "Cap-SOP §7.4"}
  # G3: Save (CSV) and Export (Cap-SOP §7.4; SKILL §3D.3). Save paths are single-quoted so backslashes stay literal.
  - {id: save_screener_csv, gate: G3, action: click, target: screener_save_button, sop_ref: "SKILL §3D.3; Cap-SOP §7.4"}
  - {id: type_csv_path, gate: G3, action: type, target: save_as_filename_box, params: {value: 'C:\BM-Factory\_landing\{run_id}_L{layer}_{field}_{seq}.csv'}, sop_ref: "Cap-SOP §7.4"}
  - {id: confirm_csv_save, gate: G3, action: click, target: save_as_save_button, sop_ref: "Cap-SOP §7.4"}
  - {id: open_data_export, gate: G3, action: click, target: data_export_menu, sop_ref: "SKILL §3D.3"}
  - {id: choose_export_to_excel, gate: G3, action: click, target: export_to_excel_item, sop_ref: "SKILL §3D.3"}
  - {id: type_save_path, gate: G3, action: type, target: save_as_filename_box, params: {value: 'C:\BM-Factory\_landing\{run_id}_L{layer}_{field}_{seq}.xls'}, sop_ref: "SKILL §3D.3; Cap-SOP §7.4"}
  - {id: confirm_save, gate: G3, action: click, target: save_as_save_button, sop_ref: "SKILL §3D.3"}
